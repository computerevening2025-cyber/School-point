<div class="login-card">
    <h2>🔐 ເຂົ້າສູ່ລະບົບ</h2>

    <div class="form-group">
        <label for="usernameInput">ຊື່ຜູ້ໃຊ້ / ຊື່:</label>
        <input type="text" id="usernameInput" placeholder="ປ້ອນຊື່ຜູ້ໃຊ້ ຫືຼ ຊື່">
    </div>

    <div class="form-group">
        <label for="passwordInput">ລະຫັດຜ່ານ (Password):</label>
        <input type="password" id="passwordInput" placeholder="ປ້ອນລະຫັດຜ່ານ">
    </div>

    <button class="btn-login" onclick="login()">ເຂົ້າສູ່ລະບົບ</button>
    <a href="index.html" class="btn-back">➡️ ກວດສອບຄະແນນນັກຮຽນ</a>
</div>
