<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ກວດເຊັກຄະແນນນັກຮຽນ - ScoreApp</title>
    <style>
        body { font-family: 'Phetsarath OT', sans-serif, Arial; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { text-align: center; color: #0d6efd; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-search { width: 100%; padding: 12px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-search:hover { background-color: #0b5ed7; }
        .student-info { background: #e7f3fe; border-left: 5px solid #0d6efd; padding: 12px 15px; border-radius: 4px; margin-bottom: 15px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .btn-login-page { text-decoration: none; color: #6c757d; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="login.html" class="btn-login-page">🔐 ເຂົ້າສູ່ລະບົບ (ຄູ / Admin)</a>
    </div>

    <div class="card">
        <h2>🔍 ກວດເຊັກຄະແນນນັກຮຽນ</h2>
        
        <!-- Dropdown เลือกห้องเรียน -->
        <div class="form-group">
            <label for="classSelect">🏫 ເລືອກຫ້ອງຮຽນ:</label>
            <select id="classSelect">
                <option value="">-- ກຳລັງໂຫຼດຫ້ອງຮຽນ... --</option>
            </select>
        </div>

        <!-- ช่องกรอกรหัสนักเรียน -->
        <div class="form-group">
            <label for="studentCodeInput">🆔 ປ້ອນລະຫັດນັກຮຽນ:</label>
            <input type="text" id="studentCodeInput" placeholder="ເຊັ່ນ: 6601">
        </div>

        <button class="btn-search" onclick="searchStudentScores()">🔎 ຄົ້ນຫາຄະແນນ</button>
    </div>

    <!-- ส่วนแสดงผลคะแนน -->
    <div class="card" id="resultCard" style="display: none;">
        <div class="student-info" id="studentInfo">
            <!-- ข้อมูลนักเรียนจะแสดงตรงนี้ -->
        </div>

        <h3>📋 ຕາຕະລາງຄະແນນທຸກວິຊາ</h3>
        <table>
            <thead>
                <tr>
                    <th>ວິຊາຮຽນ</th>
                    <th style="text-align: right;">ຄະແນນ</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody">
                <!-- รายการคะแนน 13 วิชาจะมาแสดงตรงนี้ -->
            </tbody>
        </table>
    </div>
</div>

<script src="script-index.js"></script>

</body>
</html>

    </div>
    <div id="result"></div>
</div>

<script>
    var subjectsList = [
        "ພາສາລາວ-ວັນນະຄະດີ",
        "ຄະນິດສາດ",
        "ວິທະຍາສາດທຳມະຊາດ",
        "ພູມສາດ",
        "ປະຫວັດສາດ",
        "ສຶກສາພົນລະເມືອງ",
        "ຄອມພິວເຕີ້",
        "ພື້ນຖານວິຊາຊີບ",
        "ພາສາອັງກິດ",
        "ສິລະປະກຳ",
        "ສິລະປະດົນຕີ",
        "ພະລະສຶກສາ"
    ];

    function runSearch() {
        var id = document.getElementById('studentId').value.trim();
        var selectedMonth = document.getElementById('monthSelect').value;
        var resultDiv = document.getElementById('result');

        if (!id) {
            resultDiv.innerHTML = "<p style='color:red; text-align:center;'>ກະລຸນາປ້ອນລະຫັດນັກຮຽນ</p>";
            return;
        }

        resultDiv.innerHTML = "<p style='text-align:center;'>ກຳລັງຄົ້ນຫາ ແລະ ໄລ່ອັນດັບທີ...</p>";

        // ดึงข้อมูลนักเรียนทั้งหมดใน Firebase มาเพื่อคำนวณอันดับที่
        var allStudentsUrl = "https://classscorem3-default-rtdb.firebaseio.com/students.json";

        fetch(allStudentsUrl)
            .then(function(response) { return response.json(); })
            .then(function(allStudents) {
                if (!allStudents || !allStudents[id]) {
                    resultDiv.innerHTML = "<p style='color:red; text-align:center;'>❌ ບໍ່ພົບຂໍ້ມູນລະຫັດນັກຮຽນນີ້</p>";
                    return;
                }

                var student = allStudents[id];
                var monthData = (student.months && student.months[selectedMonth]) ? student.months[selectedMonth].scores : null;

                if (!monthData) {
                    resultDiv.innerHTML = "<p style='color:orange; text-align:center;'>⚠️ ບໍ່ພົບຂໍ້ມູນຄະແນນຂອງເດືອນນີ້</p>";
                    return;
                }

                // --- 1. คำนวณคะแนนรวมของนักเรียนทุกคนในห้องประจำเดือนนี้ ---
                var studentTotals = [];
                var totalStudentsCount = 0;

                Object.keys(allStudents).forEach(function(sKey) {
                    var sObj = allStudents[sKey];
                    if (sObj.months && sObj.months[selectedMonth] && sObj.months[selectedMonth].scores) {
                        var sScores = sObj.months[selectedMonth].scores;
                        var sTotal = 0;
                        for (var i = 0; i < subjectsList.length; i++) {
                            var subjName = subjectsList[i];
                            if (sScores[subjName] !== undefined) {
                                sTotal += Number(sScores[subjName]);
                            }
                        }
                        studentTotals.push({ id: sKey, total: sTotal });
                        totalStudentsCount++;
                    }
                });

                // เรียงลำดับคะแนนรวมจาก "มากไปน้อย"
                studentTotals.sort(function(a, b) { return b.total - a.total; });

                // หาอันดับที่ของนักเรียนคนนี้
                var currentRank = 0;
                for (var r = 0; r < studentTotals.length; r++) {
                    if (studentTotals[r].id === id) {
                        currentRank = r + 1;
                        break;
                    }
                }

                // --- 2. คำนวณคะแนนของนักเรียนคนปัจจุบัน ---
                var total = 0;
                var count = 0;
                var rowsHtml = "";

                rowsHtml += "<tr><td class='label'>ລະຫັດ:</td><td class='val'>" + (student.studentId || id) + "</td></tr>";
                rowsHtml += "<tr><td class='label'>ຊື່ ແລະ ນາມສະກຸນ:</td><td class='val'>" + (student.name || '-') + "</td></tr>";
                rowsHtml += "<tr><td class='label'>ຊື່ຫຼິ້ນ:</td><td class='val'>" + (student.nickname || '-') + "</td></tr>";

                for (var m = 0; m < subjectsList.length; m++) {
                    var sName = subjectsList[m];
                    var scoreVal = monthData[sName] !== undefined ? Number(monthData[sName]) : 0;
                    if (monthData[sName] !== undefined) {
                        total += scoreVal;
                        count++;
                    }
                    rowsHtml += "<tr><td class='label'>" + sName + ":</td><td class='val'>" + scoreVal + "</td></tr>";
                }

                var avgScore = count > 0 ? (total / count).toFixed(2) : 0;

                rowsHtml += "<tr class='highlight'><td class='label'>ຄະແນນລວມ:</td><td class='val'>" + total + "</td></tr>";
                rowsHtml += "<tr class='highlight'><td class='label'>ຄະແນນສະເລ່ຍ:</td><td class='val'>" + avgScore + "</td></tr>";
                rowsHtml += "<tr class='highlight'><td class='label'>ຈັດອັນດັບທີ:</td><td class='val rank-val'>🏆 " + currentRank + " / " + totalStudentsCount + "</td></tr>";

                resultDiv.innerHTML = "<table class='score-table'>" + rowsHtml + "</table>";
            })
            .catch(function(err) {
                console.error(err);
                resultDiv.innerHTML = "<p style='color:red; text-align:center;'>ເກີດຂໍ້ຜິດພາດ: " + err.message + "</p>";
            });
    }

    document.getElementById('searchBtn').addEventListener('click', runSearch);

    window.addEventListener('DOMContentLoaded', function() {
        var urlParams = new URLSearchParams(window.location.search);
        var urlId = urlParams.get('id');
        var urlMonth = urlParams.get('month');

        if (urlMonth) {
            document.getElementById('monthSelect').value = urlMonth;
        }

        if (urlId) {
            document.getElementById('studentId').value = urlId;
            runSearch();
        }
    });
</script>

</body>
</html> -->
