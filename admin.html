<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຈັດການ Admin</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { color: #333; margin-top: 0; }
        .form-group { margin-bottom: 12px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; margin-top: 5px; }
        button { cursor: pointer; border: none; border-radius: 5px; padding: 10px 15px; font-weight: bold; font-size: 14px; }
        .btn-add { background-color: #28a745; color: white; width: 100%; margin-top: 10px; }
        .btn-edit { background-color: #ffc107; color: #333; margin-right: 5px; }
        .btn-delete { background-color: #dc3545; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ ລະບົບຈັດການ Admin</h2>

    <!-- Section 1: จัดการห้องเรียน -->
    <div class="card">
        <h3>🏫 1. ຈັດການຫ້ອງຮຽນ (Classes)</h3>
        <div class="form-group">
            <input type="text" id="classNameInput" placeholder="ເພີ່ມຊື່ຫ້ອງຮຽນ">
            <button class="btn-add" onclick="saveClass()">+ ບັນທຶກ / ເພີ່ມຫ້ອງຮຽນ</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>ຊື່ຫ້ອງຮຽນ</th>
                    <th style="width: 140px;">ຈັດການ</th>
                </tr>
            </thead>
            <tbody id="classList">
                <!-- รายชื่อห้องจะมาโหลดตรงนี้ -->
            </tbody>
        </table>
    </div>

    <!-- Section 2: จัดการคุณครู -->
    <div class="card">
        <h3>👨‍🏫 2. ຈັດການຄູປະຈຳຫ້ອງ (Teachers)</h3>
        <input type="hidden" id="editTeacherId"> <!-- เก็บ ID เวลาแก้ไข -->
        
        <div class="form-group">
            <input type="text" id="teacherName" placeholder="ຊື່ ແລະ ນາມສະກຸນຄູ">
        </div>
        <div class="form-group">
            <input type="password" id="teacherPasscode" placeholder="ລະຫັດຜ່ານ (Passcode)">
        </div>
        <div class="form-group">
            <select id="teacherClassSelect">
                <option value="">-- ເລືອກຊັ້ນຫ້ອງຮຽນ --</option>
            </select>
        </div>
        <button class="btn-add" id="btnSaveTeacher" onclick="saveTeacher()">+ ບັນທຶກ / ເພີ່ມລາຍຊື່ຄູ</button>
        
        <table>
            <thead>
                <tr>
                    <th>ຊື່ ແລະ ນາມສະກຸນຄູ</th>
                    <th>ຫ້ອງປະຈຳຊັ້ນ</th>
                    <th style="width: 140px;">ຈັດການ</th>
                </tr>
            </thead>
            <tbody id="teacherList">
                <!-- รายชื่อครูจะมาโหลดตรงนี้ -->
            </tbody>
        </table>
        <div>
            <button><a href="index.html">ກັບຄືນສູ່ໜ້າຫຼັກ</a></button>
        </div>
    </div>
</div>

<!-- เรียกใช้ไฟล์ JavaScript แยก -->
<script src="script-login.js">
    // ตรวจสอบว่าผ่านการ Login มาหรือยัง ถ้ายังให้เด้งกลับไปหน้า login
if (sessionStorage.getItem("isAdminLoggedIn") !== "true") {
    alert("ກະລຸນາເຂົ້າສູ່ລະບົບກ່ອນ!");
    window.location.href = "login.html";
}
    // ⚠️ อย่าลืมเปลี่ยน URL ของ Firebase ให้ตรงกับของคุณครูนะครับ
const FIREBASE_URL = "https://student-point2026-2027-default-rtdb.firebaseio.com/";
// โหลดข้อมูลเมื่อเปิดหน้าเว็บ
document.addEventListener("DOMContentLoaded", () => {
    loadClasses();
    loadTeachers();
});

// ==========================================
// 1. ระบบจัดการห้องเรียน (Classes)
// ==========================================

// โหลดห้องเรียนทั้งหมดมาแสดง
function loadClasses() {
    fetch(`${FIREBASE_URL}/classes.json`)
        .then(res => res.json())
        .then(data => {
            const classList = document.getElementById('classList');
            const teacherClassSelect = document.getElementById('teacherClassSelect');
            
            classList.innerHTML = '';
            teacherClassSelect.innerHTML = '<option value="">-- ເລືອກຫ້ອງປະຈຳຊັ້້ນ --</option>';

            if (data) {
                Object.keys(data).forEach(key => {
                    const cls = data[key];
                    // เพิ่มลงตารางห้องเรียน
                    classList.innerHTML += `
                        <tr>
                            <td><b>ຫ້ອງ ${cls}</b></td>
                            <td>
                                <button class="btn-delete" onclick="deleteClass('${key}')">ລົບ</button>
                            </td>
                        </tr>
                    `;
                    // เพิ่มลง Dropdown ตัวเลือกห้องสำหรับครู
                    teacherClassSelect.innerHTML += <option value="${cls}">ຫ້ອງ ${cls}</option>;
                });
            } else {
                classList.innerHTML = '<tr><td colspan="2">ยัຍັງບໍ່ມີຂໍ້ມູນຫ້ອງຮຽນ</td></tr>';
            }
        });
}

// เพิ่มห้องเรียนใหม่
function saveClass() {
    const className = document.getElementById('classNameInput').value.trim();
    if (!className) return alert("ກະລຸນາໃສ່ຊື່ຫ້ອງຮຽນ!");

    // ใช้ชื่อห้องเป็น Key เพื่อป้องกันข้อมูลซ้ำ
    fetch(`${FIREBASE_URL}/classes/${className}.json`, {
        method: 'PUT',
        body: JSON.stringify(className)
    }).then(() => {
        alert("ບັນທຶກຫ້ອງຮຽນຮຽບຮ້ອຍ!");
        document.getElementById('classNameInput').value = '';
        loadClasses();
    });
}

// ลบห้องเรียน
function deleteClass(key) {
    if (confirm(ທ່ານຕ້ອງການຈະລົບຫ້ອງຮຽນ `${key} ແທ້ ຫຼື ບໍ່?`)) {
        fetch(`${FIREBASE_URL}/classes/${key}.json, { method: 'DELETE' }`)
            .then(() => {
                alert("ລົບຫ້ອງຮຽນສຳເລັດ!");
                loadClasses();
            });
    }
}

// ==========================================
// 2. ระบบจัดการคุณครู (Teachers)
// ==========================================

// โหลดรายชื่อครูทั้งหมดมาแสดง
function loadTeachers() {
    fetch(`${FIREBASE_URL}/teachers.json`)
        .then(res => res.json())
        .then(data => {
            const teacherList = document.getElementById('teacherList');
            teacherList.innerHTML = '';

            if (data) {
                Object.keys(data).forEach(id => {
                    const tc = data[id];
                    teacherList.innerHTML += `
                        <tr>
                            <td>${tc.name}</td>
                            <td><span style="background:#e9ecef; padding: 3px 8px; border-radius: 4px;">ຫ້ອງ ${tc.assignedClass}</span></td>
                            <td>
                                <button class="btn-edit" onclick="editTeacher('${id}', '${tc.name}', '${tc.passcode}', '${tc.assignedClass}')">ແກ້ໄຂ</button>
                                <button class="btn-delete" onclick="deleteTeacher('${id}')">ລົບ</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                teacherList.innerHTML = '<tr><td colspan="3">ຍັງບໍ່ມິຂໍ້ມູນຄູໃນລະບົບ</td></tr>';
            }
        });
}

// บันทึก / แก้ไขข้อมูลครู
function saveTeacher() {
    const editId = document.getElementById('editTeacherId').value;
    const name = document.getElementById('teacherName').value.trim();
    const passcode = document.getElementById('teacherPasscode').value.trim();
    const assignedClass = document.getElementById('teacherClassSelect').value;

    if (!name || !passcode || !assignedClass) {
        return alert("ກະລຸນາເພີ່ມຂໍ້ມູນຄູ!");
    }

    // ถ้ามี editId แสดงว่าแก้ไข ถ้าไม่มีแสดงว่าเพิ่มใหม่ (สร้าง ID สุ่ม)
    const teacherId = editId ? editId : "tc_" + Date.now();
    const teacherData = { name, passcode, assignedClass };

    fetch(`${FIREBASE_URL}/teachers/${teacherId}.json`, {
        method: 'PUT',
        body: JSON.stringify(teacherData)
    }).then(() => {
        alert(editId ? "ອັບເດດຂໍ້ມູນຄູສຳເລັດ!" : "ເພີ່ມຄູໃໝ່ສຳເລັດ!");
        resetTeacherForm();
        loadTeachers();
    });
}

// ดึงข้อมูลครูมาใส่ช่องป้อน เพื่อเตรียมแก้ไข
function editTeacher(id, name, passcode, assignedClass) {
    document.getElementById('editTeacherId').value = id;
    document.getElementById('teacherName').value = name;
    document.getElementById('teacherPasscode').value = passcode;
    document.getElementById('teacherClassSelect').value = assignedClass;
    
    const btn = document.getElementById('btnSaveTeacher');
    btn.innerText = "✏️ ບັນທຶກການແກ້ໄຂຂໍ້ມູນຄູ";
    btn.style.backgroundColor = "#ffc107";
    btn.style.color = "#333";
}

// ลบข้อมูลครู
function deleteTeacher(id) {
    if (confirm("ທ່ານຕ້ອງການລົບຂໍ້ມູນຄູແທ້ ຫຼື ບໍ່?")) {
        fetch(`${FIREBASE_URL}/teachers/${id}.json, { method: 'DELETE' }`)
            .then(() => {
                alert("ລົບຂໍ້ມູນຄູຮຽບຮ່້ອຍແລ້ວ!");
                loadTeachers();
            });
    }
}

// ล้างค่าในฟอร์มครู
function resetTeacherForm() {
    document.getElementById('editTeacherId').value = '';
    document.getElementById('teacherName').value = '';
    document.getElementById('teacherPasscode').value = '';
    document.getElementById('teacherClassSelect').value = '';
    
    const btn = document.getElementById('btnSaveTeacher');
    btn.innerText = "+ ບັນທຶກ / ເພີ່ມລາຍຊື່ຄູ";
    btn.style.backgroundColor = "#28a745";
    btn.style.color = "white";
}
</script>

</body>
